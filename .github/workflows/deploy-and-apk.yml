name: Deploy Live Website & Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy-web:
    name: نشر الموقع تلقائياً (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: إعداد GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: بناء الموقع للمسار الحي
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: نشر التحديث فوراً على الرابط الحي
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: بناء ملف تثبيت الموبايل (Android APK)
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تجهيز Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت الحزم وبناء الويب للتطبيق
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: تجهيز مشروع Capacitor Android وبناء APK
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع ملف APK جاهز للتحميل والتثبيت
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-dakahlia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
